<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ficha fiel, página 2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400&amp;family=Cabin:wght@400;500;600&amp;family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&amp;display=swap">
<style>
:root{
  --palette-paper:#ffffff;--palette-paper-tint:#f0e2df;--palette-ink:#231f20;--palette-ink-muted:#5e5a5b;
  --palette-graphite:#9d9d9d;--palette-mist:#c8c7c7;--palette-crimson:#790914;
  --color-surface:var(--palette-paper);--color-surface-tint:var(--palette-paper-tint);
  --color-text:var(--palette-ink);--color-text-muted:var(--palette-ink-muted);--color-text-accent:var(--palette-crimson);
  --color-border:var(--palette-mist);--color-rule:var(--palette-crimson);--color-divider:var(--palette-ink);--color-leader:var(--palette-graphite);
  --color-accent:var(--palette-crimson);
  --color-trait-border:var(--palette-ink);--color-trait-empty:var(--palette-paper);--color-trait-filled:var(--palette-ink);--color-trait-marked:var(--palette-crimson);
  --font-serif:"Cormorant Garamond","EB Garamond",Garamond,Georgia,serif;
  --font-display:"Bodoni Moda","Bodoni 72",Didot,Georgia,serif;
  --font-sans:"Cabin","Gill Sans",Calibri,system-ui,sans-serif;
}
body{margin:0;background:#ffffff}
</style>
</helmet>
<div style="box-sizing: border-box; background: var(--color-surface); color: var(--color-text); font-family: var(--font-serif); font-weight: 500; font-size: 1.125rem; line-height: 1.5; padding: 2rem 1.5rem 1.5rem">
<div style="max-width: 1180px; margin: 0 auto">

<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.75rem; padding-bottom: 0.5rem; border-bottom: 2px solid var(--color-rule)">
<div style="font-family: var(--font-display); font-size: 2.5rem; line-height: 1.1">Personagem Exemplo</div>
<div style="font-family: var(--font-sans); font-size: 0.6875rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--color-text-accent)">Ficha · página 2 de 2 · perfil</div>
</div>

<h2 style="margin: 1.5rem 0 0.75rem; padding-bottom: 0.25rem; border-bottom: 1px solid var(--color-rule); text-align: center; font: 600 1.375rem/1.1 var(--font-serif); letter-spacing: 0.12em; text-transform: uppercase">Beliefs</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem 1.5rem">
<sc-for list="{{beliefs}}" as="a" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column">
<span style="flex: none; font-style: italic">{{a.label}}</span>
<textarea value="{{a.value}}" onInput="{{a.set}}" aria-label="{{a.aria}}" rows="1" style="display: block; inline-size: 100%; block-size: 8rem; box-sizing: border-box; margin-top: 0.25rem; padding: 0.375rem 0.5rem; border: 1px dotted var(--color-leader); border-radius: 0; background: transparent; resize: none; outline-offset: 2px; font-family: var(--font-sans); font-size: 0.8125rem; color: var(--color-text-muted)"></textarea>
</div>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 0 1.5rem; margin-top: 1.5rem; block-size: 1230px">

<div style="display: flex; flex-direction: column; min-block-size: 0">
<sc-for list="{{meritGroups}}" as="g" hint-placeholder-count="2">
<div style="flex: 1 1 0; min-block-size: 0; display: flex; flex-direction: column; padding-top: {{g.pt}}">
<h2 style="flex: none; margin: 0 0 0.75rem; padding-bottom: 0.25rem; border-bottom: 1px solid var(--color-rule); text-align: center; font: 600 1.375rem/1.1 var(--font-serif); letter-spacing: 0.12em; text-transform: uppercase">{{g.title}}</h2>
<div style="flex: 1 1 0; min-block-size: 0; display: flex; flex-direction: column">
<sc-for list="{{g.rows}}" as="m" hint-placeholder-count="11">
<div style="flex: 1 1 0; min-block-size: 1.75rem; display: flex; align-items: flex-end; gap: 0.5rem; padding-bottom: 0.25rem">
<input type="text" value="{{m.name}}" onInput="{{m.setName}}" aria-label="{{m.nameAria}}" style="flex: 1; min-width: 0; box-sizing: border-box; border: 0; border-bottom: 1px dotted var(--color-leader); border-radius: 0; background: transparent; outline-offset: 2px; padding: 0 0.25rem; font-family: var(--font-sans); font-size: 0.8125rem; color: var(--color-text-muted)">
<span role="group" aria-label="{{m.aria}}" style="flex: none; display: inline-flex; align-items: center; margin-bottom: 0.1875rem"><sc-for list="{{m.cells}}" as="d" hint-placeholder-count="5"><button type="button" aria-label="{{d.aria}}" onClick="{{d.pick}}" style="inline-size: 0.8rem; block-size: 0.8rem; padding: 0; cursor: pointer; box-sizing: border-box; border: 1px solid var(--color-trait-border); border-radius: 9999px; background: {{d.bg}}; margin-inline-start: {{d.ml}}"></button></sc-for></span>
</div>
</sc-for>
</div>
</div>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; min-block-size: 0; padding-inline-start: 1.5rem; border-inline-start: 1px solid; border-image: linear-gradient(to bottom, transparent, var(--color-rule) 6%, var(--color-rule) 94%, transparent) 1; -webkit-print-color-adjust: exact; print-color-adjust: exact">
<h2 style="flex: none; margin: 0 0 0.75rem; padding-bottom: 0.25rem; border-bottom: 1px solid var(--color-rule); text-align: center; font: 600 1.375rem/1.1 var(--font-serif); letter-spacing: 0.12em; text-transform: uppercase">Profile</h2>

<div style="flex: none; display: flex; gap: 1.5rem; align-items: stretch">
<label style="position: relative; flex: none; inline-size: 7rem; block-size: 9.333rem; box-sizing: border-box; border: 1px solid var(--color-rule); display: flex; align-items: center; justify-content: center; text-align: center; cursor: pointer; overflow: hidden">
<img src="{{photoSrc}}" alt="Foto do personagem" style="display: {{photoImgD}}; position: absolute; inset: 0; inline-size: 100%; block-size: 100%; object-fit: cover">
<span style="display: {{photoPhD}}; padding: 0.5rem; font-family: var(--font-sans); font-size: 0.6875rem; letter-spacing: 0.16em; text-transform: uppercase; line-height: 1.5; color: var(--color-text-muted)">Foto<br>3 × 4 cm<br><span style="letter-spacing: 0; text-transform: none; color: var(--color-leader)">clique para escolher</span></span>
<input type="file" accept="image/*" onChange="{{pickPhoto}}" aria-label="Escolher foto do personagem" style="position: absolute; inset: 0; inline-size: 100%; block-size: 100%; opacity: 0; cursor: pointer">
</label>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between">
<sc-for list="{{profileFields}}" as="f" hint-placeholder-count="5">
<div style="display: flex; align-items: baseline; gap: 0.5rem"><span style="flex: none">{{f.label}}</span><input type="text" value="{{f.value}}" onInput="{{f.set}}" aria-label="{{f.aria}}" style="flex: 1; min-width: 0; box-sizing: border-box; border: 0; border-bottom: 1px dotted var(--color-leader); border-radius: 0; background: transparent; outline-offset: 2px; padding: 0 0.25rem; font-family: var(--font-sans); font-size: 0.8125rem; color: var(--color-text-muted)"></div>
</sc-for>
</div>
</div>

<div style="flex: 5 1 0; min-block-size: 0; display: flex; flex-direction: column; margin-top: 1rem">
<sc-for list="{{areasTop}}" as="a" hint-placeholder-count="1">
<span style="flex: none; font-style: italic">{{a.label}}</span>
<textarea value="{{a.value}}" onInput="{{a.set}}" aria-label="{{a.aria}}" rows="1" style="flex: 1 1 0; min-block-size: 2.5rem; display: block; inline-size: 100%; box-sizing: border-box; margin-top: 0.25rem; padding: 0.375rem 0.5rem; border: 1px dotted var(--color-leader); border-radius: 0; background: transparent; resize: none; outline-offset: 2px; font-family: var(--font-sans); font-size: 0.8125rem; color: var(--color-text-muted)"></textarea>
</sc-for>
</div>

<div style="flex: 7 1 0; min-block-size: 0; display: flex; gap: 1.5rem; margin-top: 1rem">
<sc-for list="{{areasBottom}}" as="a" hint-placeholder-count="2">
<div style="flex: {{a.grow}} 1 0; min-inline-size: 0; display: flex; flex-direction: column">
<span style="flex: none; font-style: italic">{{a.label}}</span>
<textarea value="{{a.value}}" onInput="{{a.set}}" aria-label="{{a.aria}}" rows="1" style="flex: 1 1 0; min-block-size: 2.5rem; display: block; inline-size: 100%; box-sizing: border-box; margin-top: 0.25rem; padding: 0.375rem 0.5rem; border: 1px dotted var(--color-leader); border-radius: 0; background: transparent; resize: none; outline-offset: 2px; font-family: var(--font-sans); font-size: 0.8125rem; color: var(--color-text-muted)"></textarea>
</div>
</sc-for>
</div>
</div>

</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1500}}'>
class Component extends DCLogic {
  state = {
    // Free text (beliefs, profile areas), keyed by label.
    tx: {},
    // Merits and Flaws: name (mn) and dots 0-5 (md), keyed by slot 0-21 (0-10 merits, 11-21 flaws).
    mn: {}, md: {},
    // Profile single-line fields, keyed by label.
    pf: {},
    // Character photo (3 x 4 cm), an object URL chosen by the player.
    photo: ''
  };
  renderVals() {
    const st = this.state;
    const area = (label, grow, seed) => ({
      label, grow, aria: label,
      value: st.tx[label] !== undefined ? st.tx[label] : (seed || ''),
      set: (e) => this.setState({ tx: { ...this.state.tx, [label]: e.target.value } })
    });
    const beliefs = [
      area('Chronicle Tenets', 1),
      area('Convictions', 1, 'Nunca abandonar a coterie.'),
      area('Touchstones', 1, 'Marta, irmã mais nova.')
    ];
    const areasTop = [area('Description & Features', 1)];
    const areasBottom = [area('Notes', 2), area('Concept', 1)];
    const field = (label, seed) => ({
      label, aria: label,
      value: st.pf[label] !== undefined ? st.pf[label] : (seed || ''),
      set: (e) => this.setState({ pf: { ...this.state.pf, [label]: e.target.value } })
    });
    const profileFields = [field('Sire'), field('Birthday'), field('Age'), field('Embraced'), field('Apparent Age')];
    // Merits (Vantagens, rows 1-11) and Flaws (Desvantagens, rows 12-22): name + 5 clickable dots. Click dot N sets N; click the last filled dot clears one.
    const seedMerits = { 0: ['Contacts', 2], 1: ['Resources', 3], 2: ['Fame', 1] };
    const merits = Array.from({ length: 22 }, (_, slot) => {
      const seed = seedMerits[slot] || ['', 0];
      const name = st.mn[slot] !== undefined ? st.mn[slot] : seed[0];
      const v = st.md[slot] !== undefined ? st.md[slot] : seed[1];
      return {
        name, nameAria: (slot < 11 ? 'Nome da vantagem ' + (slot + 1) : 'Nome da desvantagem ' + (slot - 10)), aria: (name || (slot < 11 ? 'Vantagem vazia' : 'Desvantagem vazia')) + ' ' + v + ' de 5',
        setName: (e) => this.setState({ mn: { ...this.state.mn, [slot]: e.target.value } }),
        cells: Array.from({ length: 5 }, (_, i) => ({
          bg: i < v ? 'var(--color-trait-filled)' : 'var(--color-trait-empty)',
          ml: i === 0 ? '0' : '2px',
          aria: (slot < 11 ? 'Vantagem ' + (slot + 1) : 'Desvantagem ' + (slot - 10)) + ': ' + (i + 1),
          pick: () => this.setState({ md: { ...this.state.md, [slot]: v === i + 1 ? i : i + 1 } })
        }))
      };
    });
    const meritGroups = [
      { title: 'Vantagens (Merits)', pt: '0', rows: merits.slice(0, 11) },
      { title: 'Desvantagens (Flaws)', pt: '1.5rem', rows: merits.slice(11) }
    ];
    const pickPhoto = (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      try { this.setState({ photo: URL.createObjectURL(file) }); } catch (err) { /* sandbox without blob URLs */ }
    };
    return {
      beliefs, areasTop, areasBottom, profileFields, meritGroups, pickPhoto,
      photoSrc: st.photo, photoImgD: st.photo ? 'block' : 'none', photoPhD: st.photo ? 'none' : 'block'
    };
  }
}
</script>
</body>
</html>
